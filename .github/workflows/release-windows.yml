name: Build Windows desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test private browser engine
        run: npm test
      - name: Build Windows installer and portable app
        run: npm run desktop:dist
      - name: Package Python fallback
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if (-not $version) {
            $version = (Get-Content package.json | ConvertFrom-Json).version
          }

          $bundle = Join-Path $PWD "release/ControlTree-Python"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item ../portable_python/START_CONTROLTREE.bat $bundle
          Copy-Item ../portable_python/controltree_server.py $bundle
          Copy-Item ../portable_python/README.txt $bundle
          Copy-Item dist (Join-Path $bundle "app") -Recurse

          $zipPath = Join-Path $PWD "release/ControlTree-Python-$version.zip"
          Compress-Archive -Path $bundle -DestinationPath $zipPath -CompressionLevel Optimal
      - name: Package portable ZIP and checksums
        shell: pwsh
        run: |
          $portable = Get-ChildItem release -Filter "ControlTree-Portable-*.exe" | Select-Object -First 1
          if (-not $portable) { throw "Portable executable was not found." }

          $zipPath = [System.IO.Path]::ChangeExtension($portable.FullName, ".zip")
          Compress-Archive -Path $portable.FullName -DestinationPath $zipPath -CompressionLevel Optimal

          $checksums = Get-ChildItem release | Where-Object { $_.Extension -in ".exe", ".zip" } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content release/SHA256SUMS.txt
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ControlTree ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ControlTree's interactive browser and desktop workbench.

            This release adds searchable variable selection, target-variable manual splitting, random and percentile splits, and a redesigned Distribution tool with target-comparison histograms, bucket examples, and scatter plots. It also includes the recent split editing, export, metric, and node right-click improvements.

            - **Setup** installs ControlTree and adds normal Windows shortcuts.
            - **Portable EXE** runs without installation after download.
            - **Portable ZIP** contains the same portable app and may be easier to download through restrictive browsers.
            - **Python ZIP** is an offline fallback for restricted Windows machines where Python 3.10+ is available but packaged apps are blocked.
            - Dataset rows stay on the computer and are processed locally.

            Windows may show an “Unknown publisher” warning because this preview is not yet code-signed.
          files: |
            web/release/*.exe
            web/release/*.zip
            web/release/*.blockmap
            web/release/SHA256SUMS.txt
