name: Build Windows desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test private browser engine
        run: npm test
      - name: Build Windows installer and portable app
        run: npm run desktop:dist
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ControlTree ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            First Windows desktop preview of ControlTree.

            - **Setup** installs ControlTree and adds normal Windows shortcuts.
            - **Portable** runs without installation after download.
            - Dataset rows stay on the computer and are processed locally.

            Windows may show an “Unknown publisher” warning because this preview is not yet code-signed.
          files: |
            web/release/*.exe
            web/release/*.blockmap
            web/release/latest.yml
