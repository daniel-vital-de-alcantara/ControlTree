name: Publish ControlTree v0.2.1 once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Trigger ControlTree v0.2.1 release build'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test browser engine
        run: npm test

      - name: Build installer and portable app
        run: npm run desktop:dist

      - name: Package Python fallback
        shell: pwsh
        run: |
          $version = "0.2.1"
          $bundle = Join-Path $PWD "release/ControlTree-Python"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item ../portable_python/START_CONTROLTREE.bat $bundle
          Copy-Item ../portable_python/controltree_server.py $bundle
          Copy-Item ../portable_python/README.txt $bundle
          Copy-Item dist (Join-Path $bundle "app") -Recurse
          $zipPath = Join-Path $PWD "release/ControlTree-Python-$version.zip"
          Compress-Archive -Path $bundle -DestinationPath $zipPath -CompressionLevel Optimal

      - name: Package portable ZIP and checksums
        shell: pwsh
        run: |
          $portable = Get-ChildItem release -Filter "ControlTree-Portable-*.exe" | Select-Object -First 1
          if (-not $portable) { throw "Portable executable was not found." }
          $zipPath = [System.IO.Path]::ChangeExtension($portable.FullName, ".zip")
          Compress-Archive -Path $portable.FullName -DestinationPath $zipPath -CompressionLevel Optimal
          $checksums = Get-ChildItem release | Where-Object { $_.Extension -in ".exe", ".zip" } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content release/SHA256SUMS.txt

      - name: Publish v0.2.1 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.1 `
            release/*.exe `
            release/*.zip `
            release/*.blockmap `
            release/SHA256SUMS.txt `
            --target $env:GITHUB_SHA `
            --title "ControlTree v0.2.1" `
            --generate-notes `
            --notes "Polished ControlTree desktop/browser release aligned with the current main branch. Includes the latest Windows launcher fixes, updated project presentation, and refreshed downloadable packages. Dataset rows remain local to the user's computer."
