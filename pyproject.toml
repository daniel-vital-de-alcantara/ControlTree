[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controltree"
version = "0.1.0"
description = "Interactive decision-tree toolkit for exploratory analysis and client-ready visualization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Daniel Vital de Alcantara" },
]
keywords = ["decision-tree", "data-analysis", "visualization", "classification", "consulting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "seaborn>=0.13",
  "graphviz>=0.20",
]

[project.urls]
Homepage = "https://daniel-vital-de-alcantara.github.io/ControlTree/"
Repository = "https://github.com/daniel-vital-de-alcantara/ControlTree"
Issues = "https://github.com/daniel-vital-de-alcantara/ControlTree/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "sphinx>=7.0",
]
web = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
